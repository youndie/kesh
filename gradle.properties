kotlin.code.style=official
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# Kotlin/Native needs its own heap; the default is small enough that the compiler spends its time in GC.
kotlin.native.jvmArgs=-Xmx3g

version=0.1.0

# What this repository tells the shared conventions.
sborka.group=io.github.youndie.kesh
sborka.repository=youndie/kesh
sborka.description=A Redis-compatible (RESP2) in-memory store on Kotlin/Native.
sborka.inceptionYear=2026

# Off: kesh is an application with no published API surface, so `public` on every declaration would
# be noise. A module that starts publishing (none is planned) turns it on for itself.
sborka.explicitApi=false
