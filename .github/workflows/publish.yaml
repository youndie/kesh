# Publishes kesh's image to GHCR (B-32). The first consumer outside this repository — a reference
# service running kompot's realtime bus through kesh — deploys it from a chart, and a chart needs an
# image somebody can pull. Until this file the image was built only where it ran.
#
# WHAT A TAG MEANS HERE. `sha-<commit>` is the only tag that names something immutable, and it is the
# one a deployment pins; `main` moves and is a convenience. `vX.Y.Z` and `vX.Y` follow a tag, when there
# is one. A tag derived from a run number looks like a version and is not one.
#
# The image is `deploy/Dockerfile` as it is — the one B-16 sized the chart on and B-18 soaked — so the
# binary links inside the build stage, and there is no Gradle step here.
name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Kotlin/Native toolchain lives in the build stage's layers; `cache-to: gha` keeps them between
      # runs. The `/root/.konan` cache mount in the Dockerfile does not survive a hosted runner — layers do.
      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # THE PUBLISHED IMAGE IS RUN, not merely pushed: pulled by the digest just written, started under a
      # memory limit (kesh refuses to start when its maxmemory does not fit — B-26), and asked to do the
      # one thing its first consumer needs: a message published on one connection arrives on another
      # that PSUBSCRIBEd — kompot's bus, reduced to two redis-cli calls. A probe alone answers before a
      # single command has been parsed.
      - name: The published image starts and carries a pattern subscription
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
          docker run -d --name kesh --memory 1g -e KESH_MAXMEMORY=67108864 -p 6379:6379 -p 8080:8080 "$IMAGE"
          for _ in $(seq 1 60); do
            sleep 0.5
            curl -sf -o /dev/null http://127.0.0.1:8080/health/ready && break
          done
          curl -sf -o /dev/null http://127.0.0.1:8080/health/ready || { docker logs kesh; exit 1; }
          # Line-buffered: redis-cli writes through stdio, and a pipe would hold the reply until exit.
          docker run -d --name sub --network host redis:7.2 \
            stdbuf -oL redis-cli -p 6379 --no-raw psubscribe "konekt:*" >/dev/null
          sleep 1
          docker run --rm --network host redis:7.2 redis-cli -p 6379 publish konekt:screen hello
          sleep 1
          OUT=$(docker logs sub 2>&1)
          docker logs kesh | tail -5
          docker rm -f sub kesh >/dev/null
          echo "$OUT"
          echo "$OUT" | grep -q '"hello"' || { echo "the subscriber did not receive the message" >&2; exit 1; }
          echo "published image $IMAGE delivered a pattern-subscribed message"
