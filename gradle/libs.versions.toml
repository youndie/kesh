# kesh's own versions. What the portfolio agrees on — Kotlin, ktor, coroutines — comes from the
# shared `wip` catalog that `io.github.youndie.sborka.settings` provides, and is NOT repeated here:
# a `kotlin` line in this file would shadow the compiler pin (research §1.8, D-7).

[versions]
# The build conventions. The same number as the settings plugin in settings.gradle.kts, so the
# conventions and the catalog they were released with are one tested combination.
sborka = "0.4.0.91"

# Ordered shutdown and probes. On the portfolio's repository, not on Maven Central. 0.1.4 is the
# latest published; it depends on kotlinx-coroutines 1.11.0 and kotlin-stdlib 2.4.10, both of which
# the 2.4.20 compiler consumes.
kore = "0.1.4"

# The client the portfolio already uses (kompot's realtime bus, research §1.1), as the conformance
# module's smoke test that an unchanged client connects. Test tooling only; nothing ships with it.
lettuce = "7.6.0.RELEASE"
# kesh's first consumer (research D-26): kompot's multi-instance bus, run against kesh by the
# conformance tool (B-27). Test tooling only.
kompot = "0.37.0"

[libraries]
kore-core = { module = "io.github.youndie:kore-core", version.ref = "kore" }
lettuce = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }
kompot-realtime-redis = { module = "io.github.youndie:kompot-realtime-redis", version.ref = "kompot" }

[plugins]
sborkaKmp = { id = "io.github.youndie.sborka.kmp", version.ref = "sborka" }
sborkaLint = { id = "io.github.youndie.sborka.lint", version.ref = "sborka" }
sborkaNativeService = { id = "io.github.youndie.sborka.native-service", version.ref = "sborka" }
