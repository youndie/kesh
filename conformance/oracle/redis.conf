# The oracle's configuration (research D-16). Only what makes Redis 7.2 answer as kesh is specified to;
# every line that is not here is Redis's default, on purpose.

# kesh has one database. With Redis's default of 16, `SELECT 1` succeeds on the oracle and fails on
# kesh, and every script touching it would differ for a reason nobody wants to read twice.
databases 1

# No persistence: the oracle is started for a run and thrown away. A save in the middle of a script
# would only add latency.
save ""
appendonly no

# The harness reaches it over the host's loopback from a container on the host network.
bind 127.0.0.1
protected-mode no
